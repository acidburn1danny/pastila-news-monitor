# Set enabled: false to disable a source without removing its stable database ID.
# categories describe broad source coverage in Romanian; --category filters
# sources, not individual articles. RSS is preferred. HTML sources may be
# enabled only with selectors verified against current public markup.
# Every source ID must remain stable, unique, lowercase, and ASCII.

sources:
  - id: digi24
    name: Digi24
    adapter: rss
    url: https://www.digi24.ro/rss
    enabled: true
    prioritate: 1
    source_category: [Politica, Social, Economie, Diverse]
    max_articles_per_poll: 60

  - id: hotnews
    name: HotNews
    adapter: rss
    url: https://hotnews.ro/feed
    enabled: true
    prioritate: 1
    source_category: [Politica, Social, Economie, Diverse]

  - id: g4media
    name: G4Media
    adapter: rss
    url: https://www.g4media.ro/feed
    enabled: true
    prioritate: 1
    source_category: [Politica, Social, Economie, Diverse]

  # Disabled: the official homepage publishes no verified RSS/Atom discovery link.
  - id: newsro
    name: News.ro
    adapter: html
    url: https://www.news.ro/
    enabled: false
    disabled_reason: No verified RSS/Atom discovery link on the official homepage.
    prioritate: 1
    source_category: [Politica, Social, Economie, Diverse]

